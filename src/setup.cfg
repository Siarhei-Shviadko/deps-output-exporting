[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache

[flake8]
ignore =
     B008, # Do not perform function calls in argument defaults.  The call is performed only once at function definition time.',
     D,      # Remove all docstring rules',
     D101, # Missing docstring in public class
     D102, # Missing docstring in public method
     D103, # Missing docstring in public function
     D104, # Missing docstring in public package
     D106, # Missing docstring in public nested class
     D107, # Missing docstring in __init__
     DAR101, # Missing parameter(s) in Docstring
     DAR201, # Missing "Returns" in Docstring
     E800, # Found commented out code
     F401, # Imported but not used
     F403,  # used; unable to detect undefined names
     F405,
     Q000, # Double quotes found but single quotes preferred
     W503, # Line break before binary operator
     WPS110, # Found wrong variable name
     WPS111, # Found too short name
     WPS115, # Found upper-case constant in a class
     WPS201, # Found module with too many imports
     WPS211, # Found too many arguments
     WPS221, # Found line with high Jones Complexity: 16 > 14
     WPS226, # Found string constant over-use
     WPS229, # Found too long ``try`` body length
     WPS237,  # Found a too complex `f` string
     WPS300, # Found local folder import
     WPS305, # Found `f` string
     WPS306, # Class without a base class
     WPS332, # Found walrus operator
     WPS347, # Found vague import that may cause confusion: *
     WPS348, # Found a line that starts with a dot
     WPS404, # Found complex default value
     WPS410,  # Found wrong metadata variable: __all__
     WPS412, # Found `__init__.py` module with logic
     WPS420, # Found wrong keyword: pass
     WPS421,  # Found wrong function call
     WPS431, # Found nested class
     WPS436, # Found protected module import
     WPS440, # Found block variables overlap: *
     WPS453,  # Found executable mismatch: file is executable but no shebang is present
     WPS600, # Found subclassing a builtin
     WPS601,  # Found shadowed class attribute
     WPS602, # Found using `@staticmethod`
     WPS604, # Found incorrect node inside `class` body
     WPS609, # Found direct magic attribute usage: __all__
     WPS326, # Found implicit string concatenation
     WPS235, # Found too many imported names from a module
     WPS230, # Found too many public instance attributes
     WPS323, # Found `%` string formatting
     WPS222, # Found a condition with too much logic: 5 > 4
     N818, # exception name should be named with an Error suffix
     S113,
     WPS324,

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
# There are multiple `assert`s in tests, we allow them:
    src/tests/*.py: S101
    ./deps_output_exporting/entrypoint.py: WPS421, WPS433, WPS430, WPS212
    ./deps_output_exporting/containers.py: WPS202, WPS203
    ./deps_output_exporting/domain/**/repository.py: WPS428
    ./deps_output_exporting/infrastructure/repositories/query_factory.py: S608
    ./deps_output_exporting/infrastructure/repositories/output/query_factory.py: WPS219
    ./deps_output_exporting/infrastructure/services/extracted_data/excel_builder/excel_data_builder.py: WPS231, WPS223
    ./deps_output_exporting/infrastructure/services/extracted_data/fields_mapper.py: WPS231, WPS220
    ./deps_output_exporting/infrastructure/services/extracted_data/excel_builder/table_data_filler.py: WPS231, WPS214
    ./deps_output_exporting/infrastructure/services/document_layout/excel_builder/tables_filler.py: WPS231
    ./deps_output_exporting/settings.py: WPS202
    ./deps_output_exporting/extras/*: S105, WPS420, WPS604, WPS112, WPS615, WPS110, WPS430, WPS220, WPS331, WPS516, WPS437, WPS601, WPS326, WPS503, WPS338, WPS214, WPS608, P101, WPS433, WPS232, S113, B019, WPS425, N805, WPS231

max-local-variables = 15
max-methods = 15
max-line-length = 120

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined
warn_no_return = False

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
