{{- if .Values.vault_settings.hashicorp_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: vault
  secretObjects:
  - data:
    - key: app-secret-key
      objectName: app-secret-key
    - key: keycloak-certs-endpoint
      objectName: keycloak-certs-endpoint
    - key: message-broker-driver
      objectName: message-broker-driver
    - key: message-broker-connection-string
      objectName: message-broker-connection-string
    - key: database-host
      objectName: database-host
    - key: database-db
      objectName: database-db
    - key: user
      objectName: user
    - key: password
      objectName: password
    - key: output-exporting-crypt-credentials-key
      objectName: output-exporting-crypt-credentials-key
    - key: new-validation-process
      objectName: new-validation-process
    secretName: {{ .Values.secrets.deps_output_exporting.secretName }}
    type: Opaque
  parameters:
    roleName: "{{ .Values.csi.roleName }}"
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    objects: |
      - objectName: "app-secret-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-output-exporting/app-secret-key"
        secretKey: "app-secret-key"
      - objectName: "keycloak-certs-endpoint"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "keycloak-certs-endpoint"
      - objectName: "message-broker-driver"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "message-broker-driver"
      - objectName: "message-broker-connection-string"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "message-broker-connection-string"
      - objectName: "database-host"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "database-host"
      - objectName: "database-db"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-output-exporting/output-exporting-database"
        secretKey: "database-db"
      - objectName: "user"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-output-exporting/output-exporting-database"
        secretKey: "user"
      - objectName: "password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-output-exporting/output-exporting-database"
        secretKey: "password"
      - objectName: "output-exporting-crypt-credentials-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-output-exporting/deps-output-exporting"
        secretKey: "output-exporting-crypt-credentials-key"
      - objectName: "output-exporting-crypt-credentials-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-output-exporting/new-validation-process"
        secretKey: "new-validation-process"
{{- end }}
