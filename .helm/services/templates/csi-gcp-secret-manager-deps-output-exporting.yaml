{{- if .Values.vault_settings.gcp_secret_manager }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-db-host/versions/latest" 
        fileName: "db-host"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-output-exporting-db-user/versions/latest" 
        fileName: "output-exporting-db-user"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-output-exporting-db-password/versions/latest" 
        fileName: "output-exporting-db-password"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-output-exporting-db/versions/latest" 
        fileName: "output-exporting-db"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/message-broker-driver/versions/latest" 
        fileName: "message-broker-driver"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-message-broker-connection-string/versions/latest" 
        fileName: "message-broker-connection-string"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-app-secret-key/versions/latest" 
        fileName: "app-secret-key"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/keycloak-certs-endpoint/versions/latest" 
        fileName: "keycloak-certs-endpoint"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-output-exporting-crypt-credentials-key/versions/latest" 
        fileName: "output-exporting-crypt-credentials-key"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-new-validation-process/versions/latest" 
        fileName: "new-validation-process"
  secretObjects:
    - secretName: {{ .Values.secrets.deps_output_exporting.secretName }}
      type: Opaque
      data:
      - objectName: "output-exporting-crypt-credentials-key"
        key: output-exporting-crypt-credentials-key
      - objectName: "new-validation-process"
        key: new-validation-process
      - objectName: "keycloak-certs-endpoint"
        key: keycloak-certs-endpoint
      - objectName: "app-secret-key"
        key: app-secret-key
      - objectName: "message-broker-connection-string"
        key: message-broker-connection-string
      - objectName: "message-broker-driver"
        key: message-broker-driver
      - objectName: "db-host"
        key: db-host
      - objectName: "output-exporting-db-user"
        key: output-exporting-db-user
      - objectName: "output-exporting-db-password"
        key: output-exporting-db-password
      - objectName: "output-exporting-db"
        key: output-exporting-db
{{- end }}
