apiVersion: v1
kind: Service
metadata:
  name: output-exporting
  labels:
    {{- include "deps-output-exporting.labels" . | nindent 4 }}
spec:
  type: {{ .Values.output_exporting.service.type }}
  ports:
    - port: {{ .Values.output_exporting.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-output-exporting.selectorLabels" . | nindent 4 }}
